[package]
name = "spirit-client-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "spirit_client_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dependencies]
serde_json = "1"
spirit-client = { path = "../client" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi = "0.32"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

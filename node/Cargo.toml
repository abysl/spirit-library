[package]
name = "spirit-node"
version = "0.1.0"
edition = "2021"

[dependencies]
ciborium = "0.2"
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.103", default-features = false, features = [
  "hide-proto-docs",
] }
iroh-tickets = "1"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.4", optional = true }
spirit-core = { path = "../core" }
spirit-index = { path = "../index", optional = true }
spirit-routing = { path = "../routing", optional = true }
spirit-schema = { path = "../schema" }
tokio = { version = "1", default-features = false, features = ["sync"] }
qrcode = { version = "0.14", default-features = false, optional = true }

[features]
default = ["native"]
native = [
  "iroh/metrics",
  "iroh/fast-apple-datapath",
  "iroh/portmapper",
  "iroh-blobs/fs-store",
  "iroh-blobs/rpc",
  "tokio/rt-multi-thread",
  "tokio/macros",
  "tokio/signal",
  "tokio/time",
  "tokio/net",
  "tokio/io-util",
  "dep:getrandom",
  "dep:qrcode",
  "dep:spirit-index",
  "dep:spirit-routing",
]

[lib]
name = "spirit_node"

[[bin]]
name = "spirit-node"
path = "src/main.rs"
required-features = ["native"]
